<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6fa;
            color: #222;
        }

        .header {
            background: #1f2937;
            color: white;
            padding: 22px 35px;
        }

        .header h1 {
            font-size: 28px;
        }

        .header p {
            margin-top: 6px;
            color: #d1d5db;
        }

        .container {
            padding: 30px;
            max-width: 1400px;
            margin: auto;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h3 {
            color: #6b7280;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .card .number {
            font-size: 30px;
            font-weight: bold;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section h2 {
            font-size: 21px;
        }

        button {
            border: none;
            padding: 10px 16px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
            background: #2563eb;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        .refresh {
            background: #374151;
        }

        .low-stock {
            background: #dc2626;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 13px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #f9fafb;
            color: #4b5563;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        input {
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            width: 100%;
        }

        .message {
            margin-top: 15px;
            font-weight: bold;
        }

        @media (max-width: 800px) {
            .cards {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 15px;
            }

            table {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<div class="header">
    <h1>Inventory Management</h1>
    <p>Inventory & Stock Management Dashboard</p>
</div>

<div class="container">

    <div class="cards">
        <div class="card">
            <h3>Total Items</h3>
            <div class="number" id="totalItems">-</div>
        </div>

        <div class="card">
            <h3>Total Inventory Value</h3>
            <div class="number" id="totalValue">-</div>
        </div>

        <div class="card">
            <h3>Low Stock Items</h3>
            <div class="number" id="lowStockItems">-</div>
        </div>
    </div>

    <div class="section">
        <div class="section-header">
            <h2>Inventory</h2>
            <button class="refresh" onclick="loadInventory()">Refresh</button>
        </div>

        <table>
            <thead>
            <tr>
                <th>Product</th>
                <th>SKU</th>
                <th>Warehouse</th>
                <th>Quantity</th>
                <th>Price</th>
                <th>Total Value</th>
            </tr>
            </thead>

            <tbody id="inventoryTable">
            </tbody>
        </table>
    </div>

    <div class="section">
        <div class="section-header">
            <h2>Low Stock</h2>
        </div>

        <table>
            <thead>
            <tr>
                <th>Product</th>
                <th>SKU</th>
                <th>Warehouse</th>
                <th>Quantity</th>
                <th>Minimum Stock</th>
            </tr>
            </thead>

            <tbody id="lowStockTable">
            </tbody>
        </table>
    </div>

    <div class="section">
        <h2>Stock In</h2>

        <div class="form-grid">
            <input type="number" id="stockInProduct" placeholder="Product ID">
            <input type="number" id="stockInWarehouse" placeholder="Warehouse ID">
            <input type="number" id="stockInQuantity" placeholder="Quantity">
        </div>

        <div class="actions">
            <button onclick="stockIn()">Add Stock</button>
        </div>

        <div class="message" id="stockInMessage"></div>
    </div>

    <div class="section">
        <h2>Stock Out</h2>

        <div class="form-grid">
            <input type="number" id="stockOutProduct" placeholder="Product ID">
            <input type="number" id="stockOutWarehouse" placeholder="Warehouse ID">
            <input type="number" id="stockOutQuantity" placeholder="Quantity">
        </div>

        <div class="actions">
            <button class="low-stock" onclick="stockOut()">Remove Stock</button>
        </div>

        <div class="message" id="stockOutMessage"></div>
    </div>

    <div class="section">
        <h2>Stock Transfer</h2>

        <div class="form-grid">
            <input type="number" id="transferProduct" placeholder="Product ID">
            <input type="number" id="fromWarehouse" placeholder="From Warehouse ID">
            <input type="number" id="toWarehouse" placeholder="To Warehouse ID">
            <input type="number" id="transferQuantity" placeholder="Quantity">
        </div>

        <div class="actions">
            <button onclick="transferStock()">Transfer Stock</button>
        </div>

        <div class="message" id="transferMessage"></div>
    </div>

    <div class="section">
        <div class="section-header">
            <h2>Reports</h2>
        </div>

        <button onclick="downloadCSV()">Generate CSV Report</button>
    </div>

</div>

<script>

    async function loadReport() {

        const response = await fetch('/api/inventory/report');
        const data = await response.json();

        document.getElementById('totalItems').textContent = data.totalItems;
        document.getElementById('totalValue').textContent =
            '₹' + data.totalValue.toLocaleString('en-IN');

        document.getElementById('lowStockItems').textContent =
            data.lowStockItems;
    }


    async function loadInventory() {

        const response = await fetch('/api/inventory');
        const data = await response.json();

        const table = document.getElementById('inventoryTable');

        table.innerHTML = '';

        data.forEach(item => {

            const totalValue =
                item.quantity * item.product.price;

            table.innerHTML += `
                <tr>
                    <td>${item.product.name}</td>
                    <td>${item.product.sku}</td>
                    <td>${item.warehouse.name}</td>
                    <td>${item.quantity}</td>
                    <td>₹${item.product.price.toLocaleString('en-IN')}</td>
                    <td>₹${totalValue.toLocaleString('en-IN')}</td>
                </tr>
            `;
        });
    }


    async function loadLowStock() {

        const response = await fetch('/api/inventory/low-stock');
        const data = await response.json();

        const table = document.getElementById('lowStockTable');

        table.innerHTML = '';

        data.forEach(item => {

            table.innerHTML += `
                <tr>
                    <td>${item.product.name}</td>
                    <td>${item.product.sku}</td>
                    <td>${item.warehouse.name}</td>
                    <td>${item.quantity}</td>
                    <td>${item.product.minimumStock}</td>
                </tr>
            `;
        });
    }


    async function stockIn() {

        const productId =
            document.getElementById('stockInProduct').value;

        const warehouseId =
            document.getElementById('stockInWarehouse').value;

        const quantity =
            document.getElementById('stockInQuantity').value;

        const response = await fetch(
            `/api/inventory/stock-in?productId=${productId}&warehouseId=${warehouseId}&quantity=${quantity}`,
            {
                method: 'POST'
            }
        );

        const data = await response.json();

        document.getElementById('stockInMessage').textContent =
            'Stock added successfully. New quantity: ' + data.quantity;

        loadDashboard();
    }


    async function stockOut() {

        const productId =
            document.getElementById('stockOutProduct').value;

        const warehouseId =
            document.getElementById('stockOutWarehouse').value;

        const quantity =
            document.getElementById('stockOutQuantity').value;

        const response = await fetch(
            `/api/inventory/stock-out?productId=${productId}&warehouseId=${warehouseId}&quantity=${quantity}`,
            {
                method: 'POST'
            }
        );

        const text = await response.text();

        document.getElementById('stockOutMessage').textContent =
            text;

        loadDashboard();
    }


    async function transferStock() {

        const productId =
            document.getElementById('transferProduct').value;

        const fromWarehouse =
            document.getElementById('fromWarehouse').value;

        const toWarehouse =
            document.getElementById('toWarehouse').value;

        const quantity =
            document.getElementById('transferQuantity').value;

        const response = await fetch(
            `/api/inventory/transfer?productId=${productId}&fromWarehouseId=${fromWarehouse}&toWarehouseId=${toWarehouse}&quantity=${quantity}`,
            {
                method: 'POST'
            }
        );

        const text = await response.text();

        document.getElementById('transferMessage').textContent =
            text;

        loadDashboard();
    }


    function downloadCSV() {

        window.location.href =
            '/api/inventory/report/csv';
    }


    function loadDashboard() {

        loadReport();
        loadInventory();
        loadLowStock();
    }


    loadDashboard();

</script>

</body>
</html>
